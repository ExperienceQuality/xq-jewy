# Canonical capabilities / enabled_tags schema.
# No URLs or secrets in YAML — set XQ_JEWY_API_BASE_URL /
# XQ_JEWY_WIREMOCK_BASE_URL in mcp.json env (union over enabled capabilities).

capabilities:
  stubs:
    enabled: true

  rest:
    enabled: true

  assertions:
    enabled: true

  reporting:
    enabled: true

enabled_tags:
  - stub
  - rest
  - verification
  - reporting
