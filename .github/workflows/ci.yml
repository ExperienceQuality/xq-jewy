name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.1", "24.x", "26.12.1", "26.x"]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: node -v
        run: node -v

      - name: Install (N-CI-02)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck (N-CI-05)
        run: npm run typecheck

      - name: Lint (N-CI-05)
        run: npm run lint

      - name: Format check (N-CI-05)
        run: npm run format:check

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Unit tests (N-CI-05)
        run: >
          npx vitest run --project unit
          --reporter=default --reporter=junit
          --outputFile.junit=artifacts/junit-unit.xml

      - name: Integration tests (N-CI-05)
        run: >
          npx vitest run --project integration
          --reporter=default --reporter=junit
          --outputFile.junit=artifacts/junit-integration.xml

      - name: System tests (N-CI-05)
        run: >
          npx vitest run --project system
          --reporter=default --reporter=junit
          --outputFile.junit=artifacts/junit-system.xml

      - name: Upload JUnit (test evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-node-${{ matrix.node }}
          path: artifacts/junit-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Coverage (N-CI-04, report-only)
        run: npx vitest run --coverage --project unit --project integration

      - name: Upload coverage (N-CI-04)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 14

      - name: Inspector smoke (N-CI-03)
        run: |
          CFG="${{ github.workspace }}/docs/config/xq.reporting-only.yaml"
          npx --yes @modelcontextprotocol/inspector@2.15.0 --cli node dist/index.js -e "XQ_JEWY_CONFIG=$CFG" --method initialize --format json
          npx --yes @modelcontextprotocol/inspector@2.15.0 --cli node dist/index.js -e "XQ_JEWY_CONFIG=$CFG" --method tools/list --format json
