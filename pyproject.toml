[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xq-jewy"
version = "0.1.0"
description = "A Python starter project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xq_jewy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.rules]
# Start strict-ish but sane; relax rules here as you learn.
# See https://docs.astral.sh/ty/reference/rules/
possibly-unresolved-reference = "error"
