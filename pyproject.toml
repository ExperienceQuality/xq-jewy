[project]
name = "xq-jewy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chauhaidang", email = "chauhaidang1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
xq-jewy = "xq_jewy.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
